name: Unity CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unity 2022.3.62f1 / ${{ matrix.testMode }} / Linux runner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: test-project
          unityVersion: 2022.3.62f1
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-2022.3.62f1-${{ matrix.testMode }}
          path: artifacts
          if-no-files-found: warn

  live-course:
    name: Unity 2022.3.62f1 / live MCP course loop / Windows
    runs-on: [self-hosted, windows, unity-2022.3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prove two concurrent authenticated Editor connections
        run: npm run test:unity:concurrent
      - name: Prove concurrent Editor cleanup after cancellation
        run: npm run test:unity:concurrent:cancel
      - name: Run authenticated live GAM 215-equivalent course loop
        run: npm run test:course:live
      - name: Upload live course evidence and Unity logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-2022.3.62f1-live-course
          path: |
            test-project/Logs/concurrent-editors-result.json
            test-project/Logs/concurrent-editors-cancellation-result.json
            test-project/Logs/concurrent-editors
            test-project/Library/UnityMcpGhost/evidence
            test-project/Logs/unity-live-course.log
          if-no-files-found: warn
